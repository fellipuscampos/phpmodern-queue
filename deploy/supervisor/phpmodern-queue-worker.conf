; Supervisor equivalent of ../systemd/phpmodern-queue-worker.service — for
; hosts where you have shell access but not systemd. Install to
; /etc/supervisor/conf.d/phpmodern-queue-worker.conf, then:
;   supervisorctl reread && supervisorctl update && supervisorctl start phpmodern-queue-worker
;
; To run more than one worker process against the same queue, supervisor's
; own `numprocs` is the simplest way — DatabaseQueue's job-claiming is
; already safe for multiple workers to poll the same table concurrently.
; e.g. numprocs=3 with process_name=%(program_name)s_%(process_num)02d

[program:phpmodern-queue-worker]
; Edit this to match your deployment.
directory=/var/www/your-app
command=/usr/bin/php vendor/bin/worker.php
user=www-data

autostart=true
autorestart=true
startsecs=2

stdout_logfile=/var/log/phpmodern-queue-worker.log
stderr_logfile=/var/log/phpmodern-queue-worker.error.log
